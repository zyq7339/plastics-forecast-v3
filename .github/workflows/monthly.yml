name: 每月预测

on:
  schedule:
    # 每月1日 16:00（北京时间）
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: pip install requests
      - name: 运行预测
        run: python forecast.py monthly
